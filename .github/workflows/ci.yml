name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: ktm_bus
          POSTGRES_PASSWORD: ktm_bus_dev
          POSTGRES_DB: ktm_bus_route_finder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      ADMIN_API_KEY: ci-test-admin-key
      JWT_SECRET_KEY: ci-test-jwt-secret
      DATABASE_URL: postgresql://ktm_bus:ktm_bus_dev@localhost:5432/ktm_bus_route_finder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & test (if frontend is scaffolded)
        run: |
          if [ -f package.json ]; then
            npm install
            npm test --if-present
          else
            echo "Frontend not yet scaffolded — skipping."
          fi
